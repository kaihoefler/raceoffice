version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - "vitest"
          - "typescript"
          - "tsx"
          - "vite"
          - "@vitejs/*"
          - "eslint"
          - "eslint-*"
          - "typescript-eslint"
          - "globals"
      mui:
        patterns:
          - "@mui/*"
          - "@emotion/*"
      react:
        patterns:
          - "react"
          - "react-*"
          - "@types/react*"
