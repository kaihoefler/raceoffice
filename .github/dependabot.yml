version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    ignore:
      # v13 ships prebuilt binaries but `npm ci` still runs node-gyp, which fails
      # on machines without a C++ toolchain. Revisit once installs work without it.
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/better-sqlite3"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.x requires TypeScript <6.1 and refuses to load with TS 7
      # ("typescript-eslint does not support TS 7.0"), so lint fails. Remove this
      # entry once a typescript-eslint release supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        patterns:
          - "vitest"
          - "typescript"
          - "tsx"
          - "vite"
          - "@vitejs/*"
          - "eslint"
          - "eslint-*"
          - "typescript-eslint"
          - "globals"
      mui:
        patterns:
          - "@mui/*"
          - "@emotion/*"
      react:
        patterns:
          - "react"
          - "react-*"
          - "@types/react*"
