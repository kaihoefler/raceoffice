name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Same version as the runtime bundled by release.yml.
          node-version: "22.21.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:all

      - name: Build
        run: npm run build:all

      # The release ships the leaderboard service as one esbuild bundle (Windows ZIP and Docker
      # image). Starting it catches dependencies that break when bundled.
      - name: Bundle leaderboard service (smoke test)
        run: |
          npm --workspace @raceoffice/leaderboard-service run bundle
          node apps/leaderboard-service/bundle/dist/index.js --version
